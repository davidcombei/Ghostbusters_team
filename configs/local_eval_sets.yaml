# Local proxy sets for scripts/local_eval.py and main_train.py --local_eval_sets.
# role: clean | matched | heldout | echo | probe
#   WF1_local = 0.3 * F1(clean) + 0.7 * mean(F1(matched), F1(heldout)), all at threshold 0.5.
# Relative paths resolve against the repository root. The sim sets are generated (frozen, v1)
# by scripts/build_dev_noisy_sim.py; never regenerate a version in place -- bump it instead.

dev_online_clean:
  role: clean
  base_dir: /mnt/paml-research/RTCFake/data/wav/dev
  protocol: data/dev_noisy_sim/dev_online_clean/protocol.txt

sim_matched_v1:
  role: matched
  base_dir: data/dev_noisy_sim/matched_v1
  protocol: data/dev_noisy_sim/matched_v1/protocol.txt
  meta: data/dev_noisy_sim/matched_v1/meta.csv

sim_heldout_v1:
  role: heldout
  base_dir: data/dev_noisy_sim/heldout_v1
  protocol: data/dev_noisy_sim/heldout_v1/protocol.txt
  meta: data/dev_noisy_sim/heldout_v1/meta.csv

sim_echo_v1:
  role: echo
  base_dir: data/dev_noisy_sim/echo_v1
  protocol: data/dev_noisy_sim/echo_v1/protocol.txt
  meta: data/dev_noisy_sim/echo_v1/meta.csv

# per-epoch selection subsets (1k each, half A only) -- used by main_train.py
sim_matched_mini:
  role: matched
  base_dir: data/dev_noisy_sim/matched_v1
  protocol: data/dev_noisy_sim/matched_v1/protocol_mini.txt
  meta: data/dev_noisy_sim/matched_v1/meta.csv

sim_heldout_mini:
  role: heldout
  base_dir: data/dev_noisy_sim/heldout_v1
  protocol: data/dev_noisy_sim/heldout_v1/protocol_mini.txt
  meta: data/dev_noisy_sim/heldout_v1/meta.csv

# shortcut-audit probes (scripts/build_probe_sets.py) -- role probe: never part of WF1
